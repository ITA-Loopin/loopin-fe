# Vercel deploy via GitHub Actions (generated by vercel-actions-deploy skill)
# Why: the GitHub account is linked to another Vercel account, so Vercel's Git
# integration blocks deployments. This deploys with a Vercel token instead.
# default branch push -> Production, other branch push -> Preview.
name: vercel-deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: loopin-fe-lw54
            id: prj_zKHRdRg1vrGj9VDUJDj8F8kH9arR
            node: "22.x"
            paths: ''
    env:
      VERCEL_ORG_ID: team_mTIhGDSaBWWNhXxtA0mFl257
      VERCEL_PROJECT_ID: ${{ matrix.project.id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check affected paths
        id: changed
        env:
          PATHS: ${{ matrix.project.paths }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$PATHS" ] || [ "${{ github.event_name }}" != "push" ] \
             || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet --depth=1 origin "$BEFORE" || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq "$PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes for ${{ matrix.project.name }}, skipping."
          fi

      - uses: actions/setup-node@v5
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: ${{ matrix.project.node }}

      - name: Install Vercel CLI and package managers
        if: steps.changed.outputs.run == 'true'
        run: npm install --global vercel@latest pnpm@latest

      - name: Pull Vercel settings
        if: steps.changed.outputs.run == 'true'
        run: vercel pull --yes --environment=${{ env.PROD == 'true' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.changed.outputs.run == 'true'
        run: vercel build ${{ env.PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.changed.outputs.run == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ env.PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "### ${{ matrix.project.name }}: $url" >> "$GITHUB_STEP_SUMMARY"
